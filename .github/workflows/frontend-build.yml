name: Plat frontend production gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Runtime security gate
        run: npm audit --omit=dev --audit-level=critical

      - name: Tests
        env:
          CI: true
        run: npm test -- --watchAll=false --runInBand

      - name: Production build
        env:
          CI: true
        run: npm run build

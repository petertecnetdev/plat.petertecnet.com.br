name: Plat frontend production gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Runtime security gate
        run: npm audit --omit=dev --audit-level=critical

      - name: Tests
        env:
          CI: true
        run: npm test -- --watchAll=false --runInBand

      - name: Production build
        env:
          CI: true
        run: npm run build

      - name: Revenue SEO sitemap gate
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            "https://plat.petertecnet.com.br/cardapio-digital/" \
            "https://plat.petertecnet.com.br/cardapio-digital-restaurante/" \
            "https://plat.petertecnet.com.br/cardapio-digital-bar/" \
            "https://plat.petertecnet.com.br/cardapio-digital-pizzaria/" \
            "https://plat.petertecnet.com.br/cardapio-digital-lanchonete/" \
            "https://plat.petertecnet.com.br/cardapio-digital-cafeteria/" \
            "https://plat.petertecnet.com.br/pedidos-online/" \
            "https://plat.petertecnet.com.br/qrcode-cardapio/" \
            "https://plat.petertecnet.com.br/planos"
          do
            grep -Fq "<loc>${url}</loc>" build/sitemap.xml || {
              echo "Missing revenue URL from generated sitemap: ${url}" >&2
              exit 1
            }
          done
